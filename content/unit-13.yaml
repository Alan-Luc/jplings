        hint: >-
          Invite with 映画を見ませんか, answer いつ with 土曜日は暇ですか, hear the soft
          no in ちょっと… and 予定がありますから, then offer 日曜日.
        explanation: >-
          The learner invites with ませんか, proposes Saturday, hears
          すみません、土曜日はちょっと… plus 予定がありますから, and reschedules to
          Sunday rather than repeating Saturday. The npc's 大丈夫です is a yes, and
          the exchange closes with 会いましょう.
      - id: u13-l3-10
        kind: speaking
        concepts: [invitation-masen-ka, invitation-ladder, decline-kara, plan-tsumori-yotei, plain-to-omou]
        prompt: >-
          Invite a coworker out, hear a soft refusal, reschedule for another day,
          and say what you intend to do. Do not look back at the lesson. Speak
          aloud.
        rubric: >-
          Does the learner invite with 〜ませんか and leave the listener free? Does the
          learner choose ましょう for agreeing rather than repeating the invitation?
          Does the learner treat ちょっと… or 予定がありますから as a refusal and offer
          another day instead of repeating the same proposal? Does the learner give a
          reason with から or present it with んです? Does the learner keep the clause
          plain before つもり or と, with だ after nouns and な-adjectives? Judge
          meaning, grammar, naturalness and register separately. There is no model
          answer.
