id: unit-a
title: Basic sentences and particles
concepts:
  - id: particle-wa
    label: は — topic marker
  - id: particle-ga
    label: が — subject marker
  - id: particle-wo
    label: を — object marker
  - id: desu
    label: です — polite copula
  - id: desu-question
    label: か — question particle
  - id: masen
    label: ません — polite negative
  - id: tai
    label: たい — wanting form
lessons:
  - id: a-topic
    title: Marking the topic with は
    steps:
      - id: a-topic-1
        kind: construction
        concepts: [particle-wa, desu]
        prompt: Say "I am a student."
        accept:
          - kanji: 私は学生です
            kana: わたしはがくせいです
            romaji: watashi wa gakusei desu
          - kanji: 学生です
            kana: がくせいです
            romaji: gakusei desu
            concepts: [desu]
        explanation: >-
          は marks わたし as the topic — what the sentence is about — and です closes
          it politely. Dropping 私は entirely is also natural when you are introducing
          yourself, so 学生です earns credit for です; what you must not do is replace は
          with が, because わたしが学生です answers "who is the student?" instead.
      - id: a-topic-2
        kind: interpretation
        concepts: [particle-wa, particle-ga]
        prompt: Who is the student?
        target:
          kanji: 学生は田中さんです
          kana: がくせいはたなかさんです
          romaji: gakusei wa tanaka san desu
        accept_meanings:
          - The student is Tanaka.
          - Tanaka is the student.
        explanation: >-
          は marks 学生 as the topic, so the sentence answers "as for the student,
          that's Tanaka". With が the sentence would identify Tanaka rather than
          answer about the student.

  - id: a-object
    title: Marking the object with を
    steps:
      - id: a-object-1
        kind: transformation
        concepts: [particle-wo, masen]
        prompt: Make "I eat sushi" into "I don't eat sushi."
        target:
          kanji: 寿司を食べます
          kana: すしをたべます
          romaji: sushi o tabemasu
        accept:
          - kanji: 寿司を食べません
            kana: すしをたべません
            romaji: sushi o tabemasen
          - kanji: 寿司は食べません
            kana: すしはたべません
            romaji: sushi wa tabemasen
            concepts: [masen, particle-wa]
        explanation: >-
          Negation changes the verb ending to ません. Both particles are accepted:
          を marks 寿司 as the thing eaten, while は is natural when you are setting it
          off against something else ("sushi, I don't eat"). Only the negative ending
          is required here.
      - id: a-object-2
        kind: transformation
        concepts: [particle-wo, tai]
        prompt: Make "I drink water" into "I want to drink water."
        target:
          kanji: 水を飲みます
          kana: みずをのみます
          romaji: mizu o nomimasu
        accept:
          - kanji: 水を飲みたいです
            kana: みずをのみたいです
            romaji: mizu o nomitai desu
          - kanji: 水が飲みたいです
            kana: みずがのみたいです
            romaji: mizu ga nomitai desu
            concepts: [tai, particle-ga]
        off_target:
          - text:
              kanji: 水を飲めます
              kana: みずをのめます
              romaji: mizu o nomemasu
            meaning: I can drink water — valid Japanese, but it says ability, not wanting.
        explanation: >-
          たい attaches to the verb stem 飲み. The thing wanted takes が as often as
          を — 水が飲みたいです is standard Japanese — so both are accepted. 飲めます
          is valid Japanese but means "can drink", answering a different question.
      - id: a-object-3
        kind: completion
        concepts: [particle-wo]
        prompt: Fill the particle — "I read a book."
        target:
          kanji: 本＿読みます
          kana: ほん＿よみます
          romaji: hon _ yomimasu
        accept:
          - kanji: を
            kana: を
            romaji: o
        explanation: を marks 本 as the object of 読みます.

  - id: a-listen
    title: Hearing the particles
    steps:
      - id: a-listen-1
        kind: listening
        concepts: [particle-wa, particle-ga]
        prompt: Listen, then write what you heard.
        target:
          kanji: 猫が好きです
          kana: ねこがすきです
          romaji: neko ga suki desu
        accept:
          - kanji: 猫が好きです
            kana: ねこがすきです
            romaji: neko ga suki desu
        explanation: >-
          すき takes が for the thing liked: 猫が好き. 猫は好きです is also natural — は
          makes the cat the topic or sets up a contrast ("cats, I like") — so は is a
          different emphasis, not a grammar error. Dictation asks for the words you
          actually heard, which is why が is required here.
      - id: a-listen-2
        kind: listening
        concepts: [particle-ga]
        prompt: What does this mean?
        target:
          kanji: 猫が好きです
          kana: ねこがすきです
          romaji: neko ga suki desu
        accept_meanings:
          - I like cats.
          - I like the cat.
        explanation: >-
          が marks 猫 as the thing liked, and すきです carries the liking. Hearing it as
          "cats like me" inverts who is doing the liking, which is why が is worth
          hearing separately from は.

  - id: a-produce
    title: Producing your own sentence
    steps:
      - id: a-produce-1
        kind: speaking
        concepts: [particle-wa, particle-wo, desu]
        prompt: Say something you want to eat, in Japanese.
        rubric: >-
          Does the sentence name a food, mark it with を, and use a wanting form
          such as 〜たいです? Judge meaning, grammar, naturalness and register
          separately.
