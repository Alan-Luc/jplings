  - id: u11-l4
    title: 道を聞く — asking, repairing, and confirming a route
    objective: >-
      Ask for directions with どのへんですか, repair a fast answer with もう一度
      お願いします, confirm the route back with 〜を曲がって、〜の隣ですね, and ask
      how long the walk takes with 何分かかりますか, then do it without scaffolding.
    anchors:
      - kanji: 郵便局はどのへんですか
        kana: ゆうびんきょくはどのへんですか
        romaji: yuubinkyoku wa dono hen desu ka
      - kanji: 駅まで何分かかりますか
        kana: えきまでなんぷんかかりますか
        romaji: eki made nanpun kakarimasu ka
      - kanji: 信号を右に曲がって、銀行の隣ですね
        kana: しんごうをみぎにまがって、ぎんこうのとなりですね
        romaji: shingou o migi ni magatte, ginkou no tonari desu ne
    teach:
      - prose: >-
          どのへんですか asks "about where?", when you know the area but not the exact
          spot. 郵便局はどのへんですか asks whereabouts the post office is. The answer
          still uses a landmark and a position: 駅の近くです, near the station;
          銀行の先です, past the bank. どのへん is not a request for a street address.
        examples:
          - kanji: 郵便局はどのへんですか
            kana: ゆうびんきょくはどのへんですか
            romaji: yuubinkyoku wa dono hen desu ka
          - kanji: 駅の近くです
            kana: えきのちかくです
            romaji: eki no chikaku desu
          - kanji: 銀行の先です
            kana: ぎんこうのさきです
            romaji: ginkou no saki desu
      - prose: >-
          何分かかりますか asks how many minutes something takes, recycling U7's
          かかります. 駅まで何分かかりますか asks how long it takes to the station;
          the answer is 歩いて五分です, five minutes on foot. まで marks the endpoint and
          何分 asks the number of minutes.
        examples:
          - kanji: 駅まで何分かかりますか
            kana: えきまでなんぷんかかりますか
            romaji: eki made nanpun kakarimasu ka
          - kanji: 歩いて五分です
            kana: あるいてごふんです
            romaji: aruite gofun desu
      - prose: >-
          A real answer comes fast. When it does, do not nod: repair it with
          すみません、もう一度お願いします or ゆっくりお願いします, then say the route back
          to check it: 信号を右に曲がって、銀行の隣ですね. The confirmation repeats the
          turn with を and the position with の, so the other person can correct one
          piece instead of starting again.
        examples:
          - kanji: すみません、もう一度お願いします
            kana: すみません、もういちどおねがいします
            romaji: sumimasen, mou ichido onegai shimasu
          - kanji: ゆっくりお願いします
            kana: ゆっくりおねがいします
            romaji: yukkuri onegai shimasu
          - kanji: 信号を右に曲がって、銀行の隣ですね
            kana: しんごうをみぎにまがって、ぎんこうのとなりですね
            romaji: shingou o migi ni magatte, ginkou no tonari desu ne
    steps:
      - id: u11-l4-1
        kind: interpretation
        concepts: [route-followup]
        prompt: What does this mean?
        target:
          kanji: 郵便局はどのへんですか
