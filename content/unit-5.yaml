        hint: 座る is godan and ends in る, so its て form is 座って.
        explanation: >-
          すみません、ここに座ってください says "Excuse me, please sit here". 座る is
          godan, so る becomes って before ください.
      - id: u5-l4-13
        kind: construction
        concepts: [wo-vs-ni-movement, te-kudasai]
        prompt: Write "I get on the train at the station."
        accept:
          - kanji: 駅で電車に乗ります
            kana: えきででんしゃにのります
            romaji: eki de densha ni norimasu
        hint: で marks where the action happens; に marks the train you get onto.
        explanation: >-
