  - id: u5-l5
    title: 今していること — putting it together
    objective: >-
      Use the て form, ている, てください and the を/に choice together in a
      conversation, then produce them without scaffolding.
    teach:
      - prose: >-
          This lesson adds no new grammar. Build the て form from the dictionary
          ending: ichidan drops る, godan follows the table, and 行って, して and 来て
          are the named exceptions. Add います for an action in progress or a state,
          and ください for a request. Ask what each verb does with the noun: に marks
          the target of 乗る and 会う, and を marks the space 歩く moves through.
        examples:
          - kanji: 東京に住んでいます
            kana: とうきょうにすんでいます
            romaji: toukyou ni sunde imasu
          - kanji: 電車に乗って、公園を歩きます
            kana: でんしゃにのって、こうえんをあるきます
            romaji: densha ni notte, kouen o arukimasu
      - prose: >-
          Read the situation before choosing the form. What is happening now or still
          true takes ています; a request takes てください; the vehicle or person the
          action lands on takes に; the ground you cross takes を. The conversation
          moves through all four, including a request you did not plan for.
    steps:
      - id: u5-l5-1
        kind: conversation
        concepts: [te-form, te-iru, te-kudasai, wo-vs-ni-movement]
        prompt: >-
          You meet a friend in Tokyo. Answer their questions, including the request
          near the end.
        scenario:
          turns:
            - speaker: npc
              line:
                kanji: 今、どこに住んでいますか。
                kana: いま、どこにすんでいますか。
                romaji: ima, doko ni sunde imasu ka
            - speaker: learner
              accept:
                - kanji: 東京に住んでいます。
                  kana: とうきょうにすんでいます。
                  romaji: toukyou ni sunde imasu
                - kanji: 大阪に住んでいます。
                  kana: おおさかにすんでいます。
                  romaji: oosaka ni sunde imasu
                - kanji: 駅の近くに住んでいます。
                  kana: えきのちかくにすんでいます。
                  romaji: eki no chikaku ni sunde imasu
            - speaker: npc
              line:
                kanji: 毎日、何をしていますか。
                kana: まいにち、なにをしていますか。
                romaji: mainichi, nani o shite imasu ka
            - speaker: learner
              accept:
                - kanji: 日本語を勉強しています。
                  kana: にほんごをべんきょうしています。
                  romaji: nihongo o benkyou shite imasu
                - kanji: 公園を歩いています。
                  kana: こうえんをあるいています。
                  romaji: kouen o aruite imasu
                - kanji: 電車に乗っています。
                  kana: でんしゃにのっています。
                  romaji: densha ni notte imasu
            - speaker: npc
              line:
                kanji: 電車に乗りますか。
                kana: でんしゃにのりますか。
                romaji: densha ni norimasu ka
            - speaker: learner
              accept:
                - kanji: はい、電車に乗ります。
                  kana: はい、でんしゃにのります。
                  romaji: hai, densha ni norimasu
                - kanji: いいえ、公園を歩きます。
                  kana: いいえ、こうえんをあるきます。
                  romaji: iie, kouen o arukimasu
                - kanji: いいえ、歩いて行きます。
                  kana: いいえ、あるいていきます。
                  romaji: iie, aruite ikimasu
            - speaker: npc
              line:
                kanji: すみません、この荷物を持ってください。
                kana: すみません、このにもつをもってください。
                romaji: sumimasen, kono nimotsu o motte kudasai
            - speaker: learner
              accept:
                - kanji: はい、持ちます。
                  kana: はい、もちます。
                  romaji: hai, mochimasu
                - kanji: わかりました。
                  kana: わかりました。
                  romaji: wakarimashita
                - kanji: はい、持っています。
                  kana: はい、もっています。
                  romaji: hai, motte imasu
            - speaker: npc
              line:
                kanji: あ、ちょっと待ってください。この電車に乗りますか。
                kana: あ、ちょっとまってください。このでんしゃにのりますか。
                romaji: a, chotto matte kudasai. kono densha ni norimasu ka
            - speaker: learner
              accept:
                - kanji: はい、この電車に乗ります。
                  kana: はい、このでんしゃにのります。
                  romaji: hai, kono densha ni norimasu
                - kanji: いいえ、次の電車に乗ります。
                  kana: いいえ、つぎのでんしゃにのります。
                  romaji: iie, tsugi no densha ni norimasu
                - kanji: ちょっと待ってください。
                  kana: ちょっとまってください。
                  romaji: chotto matte kudasai
            - speaker: npc
              line:
                kanji: そうですか。じゃあ、一緒に行きましょう。
                kana: そうですか。じゃあ、いっしょにいきましょう。
                romaji: sou desu ka. jaa, issho ni ikimashou
        hint: >-
          Use ています for what is happening or still true, てください for a request,
          に for the vehicle you get onto and を for the park you walk through.
        explanation: >-
          The conversation moves from where you live (住んでいます, a state) to what
          you do every day (ています), then to the train and the park (に vs を). The
          unexpected request この荷物を持ってください needs the て form in an answer,
          and the last question repeats 電車に乗りますか after a request to wait.
      - id: u5-l5-2
        kind: speaking
        concepts: [te-form, te-iru, te-kudasai, wo-vs-ni-movement]
        prompt: >-
          Say where you live, what you are doing now, one request, and one movement
          sentence with 乗る, 会う or 歩く. Use the て form, ている, てください and the
          right particle. Speak without looking back at the lesson.
        rubric: >-
          Does it build the て form from the dictionary ending, including the named
          exceptions? Does it use ている for an action in progress or a resulting
          state, with 住んでいる or 持っている read as a state? Does it use てください
          for a request? Does it choose に with 乗る or 会う and を with 歩く? Judge
          meaning, grammar, naturalness and register separately. There is no model
          answer.
