          に would make the park a destination instead.
      - id: u5-l4-15
        kind: completion
        concepts: [wo-vs-ni-movement]
        prompt: Fill the particle — "I get on the train."
        target:
          kanji: 電車＿乗ります
          kana: でんしゃ＿のります
          romaji: densha _ norimasu
        accept:
          - kanji: に
            kana: に
            romaji: ni
        hint: 乗る takes the particle for the vehicle you get onto.
        explanation: >-
