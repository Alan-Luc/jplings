  - id: u5-l4
    title: 〜てください and the particle each verb chooses
    objective: >-
      Request with てください, and choose に with 乗る and 会う and を with 歩く from
      what each verb does with the noun.
    anchors:
      - kanji: 待ってください
        kana: まってください
        romaji: matte kudasai
      - kanji: 電車に乗る
        kana: でんしゃにのる
        romaji: densha ni noru
      - kanji: 公園を歩く
        kana: こうえんをあるく
        romaji: kouen o aruku
    teach:
      - prose: >-
          てください attaches to the て form to make a request: 待ってください "please
          wait", 教えてください "please teach me", 降りてください "please get off".
          The て form does not change. ます + ください is wrong, so 待ちますください is
          not a form Japanese uses.
        examples:
          - kanji: 待ってください
            kana: まってください
            romaji: matte kudasai
          - kanji: 教えてください
            kana: おしえてください
            romaji: oshiete kudasai
      - prose: >-
          に marks the point or target the action lands on. 乗る "get on" takes に
          because you board the vehicle: 電車に乗る. 会う "meet" takes に because the
          person is who the meeting lands on: 友だちに会う. を marks what an action
          acts on, but 歩く uses it for the space you move through: 公園を歩く, like
          道を歩く.
        examples:
          - kanji: 電車に乗る
            kana: でんしゃにのる
            romaji: densha ni noru
          - kanji: 友だちに会う
            kana: ともだちにあう
            romaji: tomodachi ni au
          - kanji: 公園を歩く
            kana: こうえんをあるく
            romaji: kouen o aruku
      - prose: >-
          The wrong particles are wrong for a reason, not because a list says so.
          電車を乗る treats the train as a thing being acted on, but 乗る lands you
          on it, so に. 友だちを会う treats the friend as an object, but 会う meets
          at the person, so に. 公園に歩く treats the park as a destination, but 歩く
          covers the ground, so を.
        examples:
          - kanji: 電車を乗る
            kana: でんしゃをのる
            romaji: densha o noru
          - kanji: 友だちを会う
            kana: ともだちにあう
            romaji: tomodachi o au
          - kanji: 公園に歩く
            kana: こうえんにあるく
            romaji: kouen ni aruku
    steps:
      - id: u5-l4-1
        kind: interpretation
        concepts: [wo-vs-ni-movement]
        prompt: >-
          Two classmates write 電車に乗ります and 電車を乗ります for "I get on the
          train". Only one is correct. What does the correct one mean?
        target:
          kanji: 電車に乗ります
          kana: でんしゃにのります
          romaji: densha ni norimasu
        accept_meanings:
          - I get on the train.
          - I board the train.
          - I will get on the train.
        hint: 乗る takes に for the vehicle you get onto.
        explanation: >-
          電車に乗ります marks the train with に because 乗る lands you on it.
          電車を乗ります treats the train as an object being acted on, which 乗る does
          not do.
      - id: u5-l4-2
        kind: interpretation
        concepts: [wo-vs-ni-movement]
        prompt: >-
          Two classmates write 公園を歩きます and 公園に歩きます for "I walk through
          the park". Only one is correct. What does the correct one mean?
        target:
          kanji: 公園を歩きます
          kana: こうえんをあるきます
          romaji: kouen o arukimasu
        accept_meanings:
          - I walk through the park.
          - I walk in the park.
          - I walk around the park.
        hint: 歩く takes を for the space you move through.
        explanation: >-
          公園を歩きます marks the park with を because the park is the ground the
          walking covers. 公園に歩きます treats the park as a destination, not the
          space crossed.
      - id: u5-l4-3
        kind: interpretation
        concepts: [wo-vs-ni-movement]
        prompt: What does this mean?
        target:
          kanji: 友だちに会います
          kana: ともだちにあいます
          romaji: tomodachi ni aimasu
        accept_meanings:
          - I meet a friend.
          - I will meet a friend.
          - I meet my friend.
        hint: 会う takes に for the person you meet.
        explanation: >-
          友だちに会います marks the friend with に because 会う meets at the person.
          友だちを会います treats the friend as an object and is not standard.
      - id: u5-l4-4
        kind: construction
        concepts: [wo-vs-ni-movement]
        prompt: >-
          A classmate writes 電車を乗ります for "I get on the train". Write the
          sentence they meant.
        accept:
          - kanji: 電車に乗ります
            kana: でんしゃにのります
            romaji: densha ni norimasu
        hint: 乗る takes に because you get onto the vehicle.
        explanation: >-
          電車に乗ります uses に for the vehicle. を would mark something the action
          acts on, but 乗る does not act on the train that way.
      - id: u5-l4-5
        kind: construction
        concepts: [wo-vs-ni-movement]
        prompt: >-
          A classmate writes 友だちを会います for "I meet a friend". Write the
          sentence they meant.
        accept:
          - kanji: 友だちに会います
            kana: ともだちにあいます
            romaji: tomodachi ni aimasu
        hint: 会う takes に for the person you meet.
        explanation: >-
          友だちに会います uses に for the person. を would make the friend the object
          of an action, but 会う meets at the person.
      - id: u5-l4-6
        kind: construction
        concepts: [wo-vs-ni-movement]
        prompt: >-
          A classmate writes 公園に歩きます for "I walk through the park". Write the
          sentence they meant.
        accept:
          - kanji: 公園を歩きます
            kana: こうえんをあるきます
            romaji: kouen o arukimasu
        hint: 歩く takes を for the space you move through.
        explanation: >-
          公園を歩きます uses を for the ground covered. に would mark a destination,
          but this sentence is about walking through the park, not to it.
      - id: u5-l4-7
        kind: construction
        concepts: [te-kudasai]
        prompt: >-
          A teacher writes 待ちますください for "Please wait". Write the sentence
          they meant.
        accept:
          - kanji: 待ってください
            kana: まってください
            romaji: matte kudasai
        hint: ください attaches to the て form, not to ます.
        explanation: >-
          待ってください is the て form 待って plus ください. 待ちますください mixes the
          ます form with ください and is not a form Japanese uses.
      - id: u5-l4-8
        kind: construction
        concepts: [te-kudasai]
        prompt: Write "Please teach me."
        accept:
          - kanji: 教えてください
            kana: おしえてください
            romaji: oshiete kudasai
        hint: 教える is ichidan, so drop る and add て, then ください.
        explanation: >-
          教えてください is 教えて + ください. The て form of the ichidan verb 教える is
          教えて.
      - id: u5-l4-9
        kind: construction
        concepts: [te-kudasai]
        prompt: Write "Please get off here."
        accept:
          - kanji: ここで降りてください
            kana: ここでおりてください
            romaji: koko de orite kudasai
        hint: 降りる is ichidan, so its て form is 降りて; で marks where.
        explanation: >-
          ここで降りてください uses 降りて + ください for the request, and で marks the
          place where the getting off happens.
      - id: u5-l4-10
        kind: construction
        concepts: [te-kudasai]
        prompt: Write "Please wait at the station."
        accept:
          - kanji: 駅で待ってください
            kana: えきでまってください
            romaji: eki de matte kudasai
        hint: 待つ → 待って, then add ください; で marks where.
        explanation: >-
          駅で待ってください joins 待って and ください for the request. 駅で marks the
          place of the waiting.
      - id: u5-l4-11
        kind: construction
        concepts: [te-kudasai]
        prompt: Write "Please wash your hands."
        accept:
          - kanji: 手を洗ってください
            kana: てをあらってください
            romaji: te o aratte kudasai
        hint: 洗う is godan and ends in う, so it takes って before ください.
        explanation: >-
          手を洗ってください uses 洗って + ください. 洗う has not appeared in this unit,
          but the う → って row still decides its て form.
      - id: u5-l4-12
        kind: listening
        concepts: [te-kudasai]
        prompt: Listen, then say what you heard.
        target:
          kanji: すみません、ここに座ってください
