  - id: u7-l4
    title: 行き方 — putting it together at the station
    objective: >-
      Use the journey particles, the boarding and leaving pair, and the duration
      question in a station conversation, then produce them without scaffolding.
    teach:
      - prose: >-
          This lesson adds no new grammar. に marks a destination or the point you
          get onto, で marks the place of an activity or the means, から and まで
          mark the two ends of the journey, and を marks the vehicle you leave. 乗る
          takes に, 降りる takes を for the vehicle, and 乗り換える takes で for the
          station and に for the line. Ask duration with どのくらいかかりますか and
          price with いくらですか.
        examples:
          - kanji: 新宿で山手線に乗り換えます
            kana: しんじゅくでやまのてせんにのりかえます
            romaji: shinjuku de yamanote sen ni norikaemasu
          - kanji: 東京駅までどのくらいかかりますか
            kana: とうきょうえきまでどのくらいかかりますか
            romaji: toukyou eki made dono kurai kakarimasu ka
      - prose: >-
          Read the task before choosing the particle. Going somewhere takes に;
          doing something somewhere takes で; starting and ending take から and まで;
          boarding takes に; leaving the vehicle takes を; changing at a station takes
          で and changing to a line takes に. For the trip itself, ask duration with
          かかります and price with いくら.
